name: Optimize original TA logo
on:
  push:
    branches: [main]
    paths:
      - 'images/E06816FB-ECE3-433F-8F9C-F07721ECF82A.png'
      - '.github/workflows/optimize-logo.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pillow
      - name: Resize original logo without redrawing
        run: |
          python - <<'PY'
          from PIL import Image
          source = 'images/E06816FB-ECE3-433F-8F9C-F07721ECF82A.png'
          im = Image.open(source).convert('RGBA')
          im.thumbnail((128, 128), Image.Resampling.LANCZOS)
          im.save('images/ta-logo-small.png', optimize=True)
          PY
      - name: Commit small logo
        run: |
          git add images/ta-logo-small.png
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Generate small logo from original hand-drawn artwork"
            git push
          fi
