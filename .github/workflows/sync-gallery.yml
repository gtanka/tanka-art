name: Update gallery from image folders
on:
  push:
    branches: [main]
    paths:
      - 'images/jewelry/**'
      - 'images/paintings/**'
      - 'scripts/sync_gallery.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/sync_gallery.py
      - name: Commit updated catalog
        run: |
          if ! git diff --quiet -- content/items.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add content/items.json
            git commit -m "Sync gallery catalog from image folders"
            git push
          fi
